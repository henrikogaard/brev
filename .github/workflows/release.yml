name: Release

# Stable ring: a signed Brev.app published from a vX.Y.Z tag (ADR-0080 §2/§3).
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  stable:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"

      - name: Gate on main ancestry and green Build
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from origin/main. Release tags must be cut on main."
            exit 1
          fi
          RUNS="$(gh run list --workflow Build --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq length)"
          if [[ "$RUNS" == "0" ]]; then
            echo "::error::Build workflow has not passed on $GITHUB_SHA; not shipping a stable release."
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Select Xcode
        run: |
          if [[ -n "${BREV_XCODE_APP:-}" ]]; then
            sudo xcode-select -s "$BREV_XCODE_APP/Contents/Developer"
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Tuist install
        run: mise exec -- tuist install

      - name: Tuist generate
        run: mise exec -- tuist generate --no-open

      - name: Set up signing material
        uses: ./.github/actions/release-signing
        with:
          phase: setup
          p12-base64: ${{ secrets.BREV_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.BREV_DEVELOPER_ID_P12_PASSWORD }}
          profile-base64: ${{ secrets.BREV_MACOS_PROFILE_STABLE_BASE64 }}
          asc-key-p8-base64: ${{ secrets.BREV_ASC_KEY_P8_BASE64 }}
          sparkle-private-ed-key: ${{ secrets.BREV_SPARKLE_PRIVATE_ED_KEY }}

      - name: Export release environment
        env:
          BREV_ASC_KEY_ID: ${{ secrets.BREV_ASC_KEY_ID }}
          BREV_ASC_ISSUER_ID: ${{ secrets.BREV_ASC_ISSUER_ID }}
          BREV_SPARKLE_PUBLIC_ED_KEY: ${{ vars.BREV_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          {
            echo "BREV_MACOS_PROVISIONING_PROFILE_SPECIFIER=$BREV_PROVISIONING_PROFILE_SPECIFIER"
            echo "BREV_ASC_KEY_ID=$BREV_ASC_KEY_ID"
            echo "BREV_ASC_ISSUER_ID=$BREV_ASC_ISSUER_ID"
            echo "BREV_SPARKLE_PUBLIC_ED_KEY=$BREV_SPARKLE_PUBLIC_ED_KEY"
          } >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba}' > "$RUNNER_TEMP/notes.txt"
          if [[ ! -s "$RUNNER_TEMP/notes.txt" ]]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section; cut the release notes before tagging."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.txt"

      - name: Build signed archive
        run: scripts/release-archive.sh --ring stable --version "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Export, notarize, and package DMG
        run: scripts/release-dmg.sh --ring stable --version "$VERSION"

      - name: Verify artifact
        run: scripts/release-artifact-verify.sh --dmg-path "build/release/Brev-${VERSION}.dmg"

      - name: Create GitHub Release
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to clobber a published stable release."
            exit 1
          fi
          gh release create "$TAG" \
            --title "Brev $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            "build/release/Brev-${VERSION}.dmg" \
            "build/release/Brev-${VERSION}.dmg.sha256"

      - name: Publish stable appcast to gh-pages
        run: |
          SITE="$RUNNER_TEMP/site"
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SITE"
          else
            mkdir -p "$SITE"
            git -C "$SITE" init -b gh-pages
            git -C "$SITE" remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            touch "$SITE/.nojekyll"
          fi
          touch "$SITE/.nojekyll"
          scripts/release-appcast.sh --ring stable \
            --dmg "build/release/Brev-${VERSION}.dmg" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Brev-${VERSION}.dmg" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            --site-dir "$SITE"
          git -C "$SITE" config user.name "github-actions[bot]"
          git -C "$SITE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE" add -A
          git -C "$SITE" commit -m "appcast: stable $VERSION" || echo "appcast unchanged"
          git -C "$SITE" push origin gh-pages

      - name: Clean up signing material
        if: always()
        uses: ./.github/actions/release-signing
        with:
          phase: cleanup
