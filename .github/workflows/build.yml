name: Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: BrevMacOS
            destination: "platform=macOS,arch=arm64"
          - scheme: BrevIOS
            destination: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Select Xcode
        run: |
          if [[ -n "${BREV_XCODE_APP:-}" ]]; then
            sudo xcode-select -s "$BREV_XCODE_APP/Contents/Developer"
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Tuist install
        run: mise exec -- tuist install

      - name: Tuist generate
        run: mise exec -- tuist generate --no-open

      - name: Verify generated projects are reproducible
        run: |
          git diff --exit-code -- \
            Brev.xcworkspace \
            apps/iOS/BrevIOS.xcodeproj \
            apps/macOS/BrevMacOS.xcodeproj

      - name: Build ${{ matrix.scheme }}
        run: |
          destination='${{ matrix.destination }}'
          if [[ '${{ matrix.scheme }}' == 'BrevIOS' ]]; then
            destination="$(scripts/ios-simulator-destination.sh)"
          fi
          xcodebuild \
            -workspace Brev.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -configuration Debug \
            -destination "$destination" \
            -skipMacroValidation \
            build || (echo "::error::xcodebuild failed for ${{ matrix.scheme }}"; exit 1)

  # Runs deterministic Swift-package logic suites. UIKit snapshot suites run in
  # the iOS Simulator job below.
  test:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - BrevBackend
          - BrevGmail
          - BrevCrypto
          - BrevSettings
          - BrevCalendar
          - BrevAI
          - BrevAvatars
          - BrevDesign
          - BrevMail
          - BrevThemes
          - BrevSyncEngine
          - BrevPlugins
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Select Xcode
        run: |
          if [[ -n "${BREV_XCODE_APP:-}" ]]; then
            sudo xcode-select -s "$BREV_XCODE_APP/Contents/Developer"
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Test ${{ matrix.package }}
        run: |
          set -o pipefail
          if [[ '${{ matrix.package }}' == 'BrevDesign' ]]; then
            # The stable SwiftPM host can signal 11 during AppKit teardown when
            # these suites share one process, after every assertion passes.
            # Each suite exits cleanly in isolation and a real assertion still
            # fails its own command.
            for suite in \
              BrevButtonTests \
              MailboxListDensityTests \
              SplitViewTransparencyPassStateTests \
              WindowAppearancePreferencesTests; do
              set +e
              suite_output="$(swift test --package-path packages/BrevDesign --filter "$suite" 2>&1)"
              suite_status=$?
              set -e
              printf '%s\n' "$suite_output"
              if [[ $suite_status -eq 0 ]]; then
                continue
              fi
              if [[ "$suite_output" == *"unexpected signal code 11"* ]] &&
                  [[ "$suite_output" == *"✔ Suite"* ]] &&
                  [[ "$suite_output" != *"recorded an issue"* ]] &&
                  [[ "$suite_output" != *"✘ Test"* ]] &&
                  [[ "$suite_output" != *"✘ Suite"* ]]; then
                echo "BrevDesign/$suite assertions passed; ignoring known AppKit teardown signal 11."
                continue
              fi
              echo "::error::tests failed for BrevDesign/$suite"
              exit 1
            done
            exit 0
          fi

          test_args=(--package-path packages/${{ matrix.package }})
          if [[ '${{ matrix.package }}' == 'BrevMail' ]]; then
            # ContactsAccessPolicy uses an intentional process-wide launch
            # gate. Run that suite in a fresh process after the main suite so
            # concurrent AppSession demo tests cannot leak global state into it.
            test_args+=(--skip 'BrevMailTests\.ContactsAccessPolicyTests')
          fi
          if [[ '${{ matrix.package }}' == 'BrevMail' ]] &&
              (( $(sw_vers -productVersion | cut -d. -f1) < 26 )); then
            # Pixel baselines are recorded on macOS 26+. Keep model/behavior
            # suites running on older hosted runners while the dedicated
            # snapshot job below owns compatible-renderer comparisons.
            test_args+=(--skip 'BrevMailTests\.(MonoMailSelectionSnapshotTests|ConversationWorkspaceSnapshotTests|DetachedMessageWindowSnapshotTests|FolderSidebarSnapshotTests|LoginViewSnapshotTests|MailContextColumnSnapshotTests|MailRootStatusRailSnapshotTests|MailUndoToastSnapshotTests|MessageListRowSnapshotTests|SavedSearchEditorViewSnapshotTests|ServerSearchSyntaxHintSnapshotTests|ThreadInlineChildRowSnapshotTests)')
          fi
          if [[ '${{ matrix.package }}' == 'BrevSettings' ]] &&
              (( $(sw_vers -productVersion | cut -d. -f1) < 26 )); then
            # Pixel and image snapshots are recorded on macOS 26+. Run the
            # behavior suites on older hosted runners and leave renderer
            # comparisons to compatible local/hosted systems.
            test_args+=(--skip 'BrevSettingsTests\.(CompactSettingsViewSmokeTests|BrevSettingsSnapshotTests|AIWriterSectionMacSnapshotTests|MailFolderExportStatusSnapshotTests)')
          fi
          swift test "${test_args[@]}" \
            || (echo "::error::tests failed for ${{ matrix.package }}"; exit 1)
          if [[ '${{ matrix.package }}' == 'BrevMail' ]]; then
            swift test --package-path packages/BrevMail --filter ContactsAccessPolicyTests \
              || (echo "::error::tests failed for BrevMail/ContactsAccessPolicyTests"; exit 1)
          fi

  snapshot-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Select Xcode
        run: |
          if [[ -n "${BREV_XCODE_APP:-}" ]]; then
            sudo xcode-select -s "$BREV_XCODE_APP/Contents/Developer"
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Check iOS snapshot baseline metadata
        run: scripts/check-ios-snapshot-baselines.sh

      - name: Resolve compatible iOS snapshot runtime
        id: snapshot-runtime
        run: |
          destination="$(scripts/ios-simulator-destination.sh)"
          runtime="${destination#*OS=}"
          runtime="${runtime%%,*}"
          major="${runtime%%.*}"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          if (( major >= 27 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "iOS pixel snapshots deferred: baselines require iOS 27+, runner has iOS $runtime"
          fi

      - name: Test stable non-WebKit BrevMail snapshots on iOS Simulator
        if: steps.snapshot-runtime.outputs.run == 'true'
        working-directory: packages/BrevMail
        run: |
          set -o pipefail
          destination='${{ steps.snapshot-runtime.outputs.destination }}'
          xcodebuild \
            -scheme BrevMail \
            -destination "$destination" \
            -skipMacroValidation \
            -testLanguage en \
            -testRegion en_US \
            '-only-testing:BrevMailTests/BrevMailRootViewSnapshotTests/rootViewWideLayout()' \
            '-only-testing:BrevMailTests/MessageDetailViewSnapshotTests/bodyLoadErrorState()' \
            '-only-testing:BrevMailTests/BrevMailSnapshotTests/threadMessageCardCollapsedRenders()' \
            '-only-testing:BrevMailTests/BrevMailSnapshotTests/threadConversationViewRendersDeterministically()' \
            '-only-testing:BrevMailTests/BrevMailSnapshotTests/composeViewRendersSignaturePicker()' \
            '-only-testing:BrevMailTests/ComposeViewSnapshotTests/emptyCompose()' \
            '-only-testing:BrevMailTests/ComposeViewSnapshotTests/replyCompose()' \
            '-only-testing:BrevMailTests/MessageDetailViewSnapshotTests/noSelectionPlaceholder()' \
            '-only-testing:BrevMailTests/MessageDetailViewSnapshotTests/headerPresentRendersSubjectAndSender()' \
            test || (echo "::error::iOS BrevMail snapshot tests failed"; exit 1)

      - name: Report deferred iOS snapshot comparison
        if: steps.snapshot-runtime.outputs.run != 'true'
        run: echo "iOS snapshot baselines remain enforced by metadata checks and compatible iOS 27+ runs."

  snapshot-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Select Xcode
        run: |
          if [[ -n "${BREV_XCODE_APP:-}" ]]; then
            sudo xcode-select -s "$BREV_XCODE_APP/Contents/Developer"
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Check macOS snapshot renderer
        id: snapshot-host
        run: |
          major="$(sw_vers -productVersion | cut -d. -f1)"
          if (( major >= 26 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "macOS pixel snapshots deferred: baselines require macOS 26+, runner has macOS $major"
          fi

      - name: Test stable macOS snapshots
        if: steps.snapshot-host.outputs.run == 'true'
        working-directory: packages/BrevMail
        run: |
          set -o pipefail
          xcodebuild \
            -scheme BrevMail \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            -testLanguage en \
            -testRegion en_US \
            -only-testing:BrevMailTests/FolderSidebarSnapshotTests \
            -only-testing:BrevMailTests/MailRootStatusRailSnapshotTests \
            -only-testing:BrevMailTests/MailUndoToastSnapshotTests \
            -only-testing:BrevMailTests/MessageListRowSnapshotTests \
            -only-testing:BrevMailTests/ThreadInlineChildRowSnapshotTests \
            -only-testing:BrevMailTests/MailContextColumnSnapshotTests \
            test || (echo "::error::macOS BrevMail snapshot tests failed"; exit 1)

      - name: Test folder export feedback snapshots
        if: steps.snapshot-host.outputs.run == 'true'
        working-directory: packages/BrevSettings
        run: |
          xcodebuild \
            -scheme BrevSettings \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            -testLanguage en \
            -testRegion en_US \
            -only-testing:BrevSettingsTests/MailFolderExportStatusSnapshotTests \
            test

      - name: Report deferred macOS snapshot comparison
        if: steps.snapshot-host.outputs.run != 'true'
        run: echo "macOS snapshot source and baselines are verified locally on macOS 26+; this host runs behavior tests only."

  performance-budget:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: Select Xcode
        run: |
          if [[ -n "${BREV_XCODE_APP:-}" ]]; then
            sudo xcode-select -s "$BREV_XCODE_APP/Contents/Developer"
          elif [[ -d /Applications/Xcode.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

      - name: Performance budget policy self-test
        run: scripts/performance-budget-gate.sh --self-test

  repository-self-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Repository self-tests
        run: scripts/test.sh --self-tests-only
