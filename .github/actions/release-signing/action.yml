name: Release signing material
description: >-
  Imports the Developer ID certificate, provisioning profiles, App Store
  Connect key, and Sparkle EdDSA key for one release job (ADR-0080 §2).
  Invoke with phase: setup after checkout, and again with phase: cleanup
  in an `if: always()` step at the end of the job.
inputs:
  phase:
    description: setup | cleanup
    required: true
  p12-base64:
    description: base64-encoded Developer ID Application .p12
    required: false
    default: ""
  p12-password:
    description: password for the .p12
    required: false
    default: ""
  profile-base64:
    description: base64-encoded .mobileprovision for the ring's bundle id
    required: false
    default: ""
  asc-key-p8-base64:
    description: base64-encoded App Store Connect .p8 key
    required: false
    default: ""
  sparkle-private-ed-key:
    description: Sparkle EdDSA private key (generate_keys -x format)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up signing material
      if: inputs.phase == 'setup'
      shell: bash
      env:
        P12_B64: ${{ inputs.p12-base64 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
        PROFILE_B64: ${{ inputs.profile-base64 }}
        ASC_P8_B64: ${{ inputs.asc-key-p8-base64 }}
        SPARKLE_KEY: ${{ inputs.sparkle-private-ed-key }}
      run: |
        set -euo pipefail
        WORK="$RUNNER_TEMP/brev-signing"
        mkdir -p "$WORK" && chmod 700 "$WORK"

        # Temporary keychain, kept off the default search-path mutation
        # surface: add to the user search list, don't replace the default.
        KEYCHAIN="$WORK/release.keychain-db"
        KC_PASS="$(openssl rand -hex 24)"
        echo "::add-mask::$KC_PASS"
        printf '%s' "$KC_PASS" >"$WORK/keychain-password"
        chmod 600 "$WORK/keychain-password"
        security create-keychain -p "$KC_PASS" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

        printf '%s' "$P12_B64" | base64 --decode >"$WORK/dev-id.p12"
        chmod 600 "$WORK/dev-id.p12"
        security import "$WORK/dev-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
        rm -f "$WORK/dev-id.p12"

        IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | grep 'Developer ID Application' | head -1 \
          | sed -E 's/.*"(.*)"/\1/')"
        if [[ -z "$IDENTITY" ]]; then
          echo "::error::No Developer ID Application identity in temp keychain"
          exit 1
        fi
        echo "BREV_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

        # Provisioning profile: decode, read UUID/Name/team, install under
        # the standard profiles directory.
        printf '%s' "$PROFILE_B64" | base64 --decode >"$WORK/profile.mobileprovision"
        security cms -D -i "$WORK/profile.mobileprovision" -o "$WORK/profile.plist"
        PROFILE_UUID="$(plutil -extract UUID raw -o - "$WORK/profile.plist" | tr -d '\r\n')"
        PROFILE_NAME="$(plutil -extract Name raw -o - "$WORK/profile.plist" | tr -d '\r\n')"
        TEAM_ID="$(plutil -extract TeamIdentifier.0 raw -o - "$WORK/profile.plist" 2>/dev/null \
          | tr -d '\r\n')"
        if [[ ! "$TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]]; then
          echo "::error::Provisioning profile did not contain a valid 10-character team identifier"
          exit 1
        fi

        # Xcode reports the profile/certificate mismatch only at archive time.
        # Compare the public certificate fingerprints here so a stale P12 or
        # profile fails with an actionable, non-secret diagnostic instead.
        IDENTITY_CERT_SHA256="$(security find-certificate -a -p -c "$IDENTITY" "$KEYCHAIN" \
          | openssl x509 -noout -fingerprint -sha256 \
          | awk -F= 'NR == 1 {print $2}' \
          | tr -d ':\r\n' | tr '[:lower:]' '[:upper:]')"
        PROFILE_CERT_SHA256="$(plutil -extract DeveloperCertificates.0 raw -o - "$WORK/profile.plist" \
          | base64 --decode \
          | openssl x509 -inform DER -noout -fingerprint -sha256 \
          | awk -F= 'NR == 1 {print $2}' \
          | tr -d ':\r\n' | tr '[:lower:]' '[:upper:]')"
        if [[ -z "$IDENTITY_CERT_SHA256" || -z "$PROFILE_CERT_SHA256" ]]; then
          echo "::error::Could not read the Developer ID certificate fingerprints"
          exit 1
        fi
        echo "Developer ID certificate SHA-256: $IDENTITY_CERT_SHA256"
        echo "Provisioning profile certificate SHA-256: $PROFILE_CERT_SHA256"
        if [[ "$IDENTITY_CERT_SHA256" != "$PROFILE_CERT_SHA256" ]]; then
          echo "::error::Developer ID certificate and provisioning profile do not match"
          exit 1
        fi
        PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILE_DIR"
        cp "$WORK/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
        printf '%s' "$PROFILE_UUID" >"$WORK/profile-uuid"
        printf 'BREV_TEAM_ID=%s\n' "$TEAM_ID" >> "$GITHUB_ENV"
        printf 'BREV_PROVISIONING_PROFILE_SPECIFIER=%s\n' "$PROFILE_NAME" >> "$GITHUB_ENV"

        printf '%s' "$ASC_P8_B64" | base64 --decode >"$WORK/AuthKey.p8"
        chmod 600 "$WORK/AuthKey.p8"
        echo "BREV_ASC_KEY_PATH=$WORK/AuthKey.p8" >> "$GITHUB_ENV"

        printf '%s' "$SPARKLE_KEY" >"$WORK/sparkle-private-ed-key"
        chmod 600 "$WORK/sparkle-private-ed-key"
        echo "BREV_SPARKLE_PRIVATE_ED_KEY_FILE=$WORK/sparkle-private-ed-key" >> "$GITHUB_ENV"

        echo "BREV_SIGNING_WORK_DIR=$WORK" >> "$GITHUB_ENV"

    - name: Clean up signing material
      if: inputs.phase == 'cleanup'
      shell: bash
      run: |
        set -euo pipefail
        WORK="${BREV_SIGNING_WORK_DIR:-$RUNNER_TEMP/brev-signing}"
        if [[ -f "$WORK/release.keychain-db" ]]; then
          security delete-keychain "$WORK/release.keychain-db" || true
        fi
        if [[ -f "$WORK/profile-uuid" ]]; then
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$(cat "$WORK/profile-uuid").mobileprovision"
        fi
        rm -rf "$WORK"
