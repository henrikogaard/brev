<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Brev — Obsidian glass — compact</title>
<desc id="desc">A monochrome glass envelope with crisp folds. Optically adjusted for 16–64 pixel use, with heavier fold edges and fewer fine lines. No raster images or blur filters.</desc>
